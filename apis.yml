aid: shuttle-central
name: Shuttle Central
description: Shuttle Central (shuttlecentral.com) is a ground transportation booking
  platform for airport and point-to-point shuttle transfers across Mexico, the Caribbean,
  the United States, and Latin America, covering 100+ destinations including Cancun,
  Punta Cana, Nassau, Los Cabos, Mexico City, Puerto Vallarta, Montego Bay, and Miami.
  Travelers book confirmed transfers online with secure payment, instant confirmation,
  and 24/7 support, and a separate transportation-provider program (shuttlecentralinc.com)
  lets ground operators sell transfers through the platform. The company is backed by
  500 Global.
